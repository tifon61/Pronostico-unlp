<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas del Pronosticador | FCAG</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #0d1117; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; background: #003f6b; color: white; flex-wrap: wrap; }
    .hdr-left { display: flex; align-items: center; gap: 10px; }
    .hdr-left img { height: 32px; }
    .hdr-left h1 { font-size: 1rem; margin: 0; font-weight: 800; }
    .back-link { color: white; text-decoration: none; font-weight: 700; font-size: 0.85rem; background: rgba(255,255,255,0.15); padding: 7px 14px; border-radius: 6px; white-space: nowrap; }
    .back-link:hover { background: rgba(255,255,255,0.28); }

    .toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: #f1f5f9; flex-wrap: wrap; }
    .toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .toolbar-group-label { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.4px; margin-right: 2px; }
    .city-btn { border: 1px solid #cbd5e1; background: white; color: #003f6b; font-weight: 700; font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.15s; }
    .city-btn:hover { background: #e0edf7; }
    .city-btn.active { background: #003f6b; color: white; border-color: #003f6b; }
    .model-btn { border: 1px solid #cbd5e1; background: white; color: #00796b; font-weight: 700; font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.15s; }
    .model-btn:hover { background: #e0f2ef; }
    .model-btn.active { background: #00796b; color: white; border-color: #00796b; }

    .map-wrap { flex: 1; position: relative; }
    .map-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .other-links { display: flex; gap: 8px; padding: 8px 16px; background: #f1f5f9; flex-wrap: wrap; border-top: 1px solid #dde4ed; }
    .other-links a { font-size: 0.78rem; font-weight: 700; color: #003f6b; text-decoration: none; background: white; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; }
    .other-links a:hover { background: #e0edf7; }
</style>
</head>
<body>

<header>
    <div class="hdr-left">
        <img src="images/Logo astronomicas y geofisicas.png" alt="FCAG" onerror="this.src='https://placehold.co/100x32/003f6b/white?text=FCAG'">
        <img src="images/Logo pronounlp.jfif" alt="Grupo de Pronóstico" style="height:32px;">
        <h1>Herramientas del Pronosticador — Modelos / Radar / Satélite</h1>
    </div>
    <a class="back-link" href="admin.html">← Volver al panel de carga</a>
</header>

<div class="toolbar">
    <div class="toolbar-group">
        <span class="toolbar-group-label">Ciudad</span>
        <span class="toolbar-group" id="city-bar"></span>
    </div>
    <div class="toolbar-group">
        <span class="toolbar-group-label">Modelo</span>
        <span class="toolbar-group" id="model-bar"></span>
    </div>
</div>

<div class="map-wrap">
    <iframe id="windy-frame" title="Windy" allow="geolocation"></iframe>
</div>

<div class="other-links">
    <a href="https://mna.fcaglp.unlp.edu.ar/variables.html" target="_blank">Portal de Modelos WRF (FCAG) →</a>
    <a href="https://www.smn.gob.ar/satelite" target="_blank">Satélite SMN →</a>
</div>

<script>
// Mismas ciudades/coordenadas que usa el mapa Leaflet del portal público
// (index.html), para que el botón de cada ciudad recentre el mapa de Windy ahí.
const CITIES = [
    { name: "La Plata",       coords: [-34.921, -57.955] },
    { name: "Junín",          coords: [-34.585, -60.944] },
    { name: "Bolívar",        coords: [-36.233, -61.116] },
    { name: "Tandil",         coords: [-37.321, -59.133] },
    { name: "Mar del Plata",  coords: [-38.005, -57.542] },
    { name: "Bahía Blanca",   coords: [-38.719, -62.272] },
];

// Modelos globales que ofrece Windy (con cobertura en Sudamérica). "product"
// es el parámetro que espera el embed de Windy para elegir el modelo.
const MODELS = [
    { code: 'ecmwf',    label: 'ECMWF' },
    { code: 'gfs',      label: 'GFS' },
    { code: 'icon',     label: 'ICON' },
    { code: 'gem',      label: 'GEM' },
];

// Estado compartido: cambiar de ciudad no debe resetear el modelo elegido, y
// viceversa — por eso el src del iframe siempre se arma desde este objeto.
const state = { lat: -36.5, lon: -60.0, zoom: 6, product: 'ecmwf' };

function windySrc() {
    return `https://embed.windy.com/embed2.html?lat=${state.lat}&lon=${state.lon}&detailLat=${state.lat}&detailLon=${state.lon}`
        + `&zoom=${state.zoom}&level=surface&overlay=radar&product=${state.product}&menu=&message=true&marker=true`
        + `&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=default`
        + `&metricTemp=default&radarRange=-1`;
}

function render() {
    document.getElementById('windy-frame').src = windySrc();
}

function selectCity(lat, lon, zoom, btn) {
    state.lat = lat; state.lon = lon; state.zoom = zoom;
    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    render();
}

function selectModel(code, btn) {
    state.product = code;
    document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    render();
}

const cityBar = document.getElementById('city-bar');
cityBar.innerHTML = `<button type="button" class="city-btn active" onclick="selectCity(-36.5, -60.0, 6, this)">Toda la región</button>`
    + CITIES.map(c => `<button type="button" class="city-btn" onclick="selectCity(${c.coords[0]}, ${c.coords[1]}, 7, this)">${c.name}</button>`).join('');

const modelBar = document.getElementById('model-bar');
modelBar.innerHTML = MODELS.map((m, i) =>
    `<button type="button" class="model-btn ${i===0?'active':''}" onclick="selectModel('${m.code}', this)">${m.label}</button>`
).join('');

render();
</script>

</body>
</html>
